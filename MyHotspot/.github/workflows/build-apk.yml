name: Build MyHotspot APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          cd MyHotspot
          chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          cd MyHotspot
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyHotspot-debug-apk
          path: "MyHotspot/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
